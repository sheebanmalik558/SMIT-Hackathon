<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | HCM Lite</title>
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQId9HOtUkQPRij8PJ0lG8lIy2YFjGHjV7-I3X6byycmQ&s" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="auth-bg">
    <main class="container">
        <div class="row g-4 justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4">
                    <h3>HCM Lite</h3>
                    <p class="text-muted">Log in to continue.</p>
                    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email"
                            placeholder="you@company.com"></div>
                    <div class="mb-3"><label class="form-label">Password</label><input class="form-control"
                            type="password" placeholder="Your password"></div>
                    <a class="btn btn-primary w-100 mb-2" href="pages/admin.html">Log in as Admin</a><a
                        class="btn btn-outline-secondary w-100" href="pages/employee.html">Log in as Employee</a>
                </div>
            </div>
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4">
                    <h3>First-run setup</h3>
                    <p class="text-muted">Create the company and the Admin account.</p>
                    <div class="mb-3"><label class="form-label">Company name</label><input class="form-control"
                            type="text" placeholder="Sheeban Tech"></div>
                    <div class="mb-3"><label class="form-label">Your name</label><input class="form-control" type="text"
                            placeholder="Full name"></div>
                    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email"
                            placeholder="admin@company.com"></div>
                    <div class="mb-3"><label class="form-label">Password</label><input class="form-control"
                            type="password" placeholder="At least 6 characters"></div>
                    <a class="btn btn-primary w-100" href="pages/admin.html">Create company</a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
