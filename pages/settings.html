<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings | HCM Lite</title>
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQId9HOtUkQPRij8PJ0lG8lIy2YFjGHjV7-I3X6byycmQ&s" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark app-nav">
        <div class="container"><span class="navbar-brand fw-bold">Sheeban Malik</span>
            <ul class="navbar-nav flex-row flex-wrap me-auto gap-3">
                <li class="nav-item"><a class="nav-link" href="admin.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="employees.html">Employees</a></li>
                <li class="nav-item"><a class="nav-link" href="leaves.html">Leaves</a></li>
                <li class="nav-item"><a class="nav-link active" href="settings.html">Settings</a></li>
                <li class="nav-item"><a class="nav-link" href="payslip.html">Payslips</a></li>
            </ul><span class="text-white-50 small">Sheeban Malik</span><a class="btn btn-sm btn-outline-light"
                href="../index.html">Log out</a>
        </div>
    </nav>
    <main class="container py-4 d-flex justify-content-center align-items-center">
        <div class="card" style="max-width:560px">
            <div class="card-header">Company settings</div>
            <div class="card-body">
                <div class="mb-3"><label class="form-label">Company name</label><input class="form-control" type="text"
                        placeholder="Sheeban Tech"></div>
                <div class="row">
                    <div class="col-4">
                        <div class="mb-3"><label class="form-label">Office start</label><input class="form-control"
                                type="time" placeholder=""></div>
                    </div>
                    <div class="col-4">
                        <div class="mb-3"><label class="form-label">Grace (min)</label><input class="form-control"
                                type="number" placeholder="15"></div>
                    </div>
                    <div class="col-4">
                        <div class="mb-3"><label class="form-label">Leave days / year</label><input class="form-control"
                                type="number" placeholder="12"></div>
                    </div>
                </div>
                <label class="form-label">Working days</label>
                <div class="mb-3">
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox"
                            id="Sun"><label class="form-check-label" for="Sun">Sun</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="Mon"
                            checked><label class="form-check-label" for="Mon">Mon</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="Tue"
                            checked><label class="form-check-label" for="Tue">Tue</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="Wed"
                            checked><label class="form-check-label" for="Wed">Wed</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="Thu"
                            checked><label class="form-check-label" for="Thu">Thu</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="Fri"
                            checked><label class="form-check-label" for="Fri">Fri</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox"
                            id="Sat"><label class="form-check-label" for="Sat">Sat</label></div>
                </div><button class="btn btn-primary">Save settings</button>
            </div>
        </div>
    </main>
</body>

</html>
